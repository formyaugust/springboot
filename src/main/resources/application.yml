server:
  port: 8848

spring:
  application:
    name: springboot
  datasource:
    username: root
    password: '000000'
    url: jdbc:mysql://localhost:3306/smart_property_sys?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
